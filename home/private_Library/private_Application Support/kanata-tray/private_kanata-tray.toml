# For help with configuration see https://github.com/rszyma/kanata-tray/blob/main/README.md#configuration
"$schema" = "https://raw.githubusercontent.com/rszyma/kanata-tray/main/doc/config_schema.json"

[general]
allow_concurrent_presets = false
control_server_enable = false
control_server_port = 8100

[defaults]
kanata_executable = '/opt/homebrew/bin/kanata'
tcp_port = 5829
autorestart_on_crash = false

[defaults.hooks]
# Hooks allow running custom commands on specific events (e.g. when starting preset).
# Documentation: https://github.com/rszyma/kanata-tray/blob/main/doc/hooks.md

[defaults.layer_icons]
# Icons live in the `icons/` folder next to this file. Paths are relative to it.
base     = 'baseTemplate.png'
typing   = 'typingTemplate.png'
arrows   = 'arrowsTemplate.png'
numbers  = 'numbersTemplate.png'
launcher = 'launcherTemplate.png'
system   = 'systemTemplate.png'
navcode  = 'navcodeTemplate.png'
modnums  = 'modnumsTemplate.png'
nohrm    = 'nohrmTemplate.png'
'*'      = 'defaultTemplate.png'


[presets.'Default Preset']
kanata_config = '~/.config/kanata/kanata.kbd'
autorun = true
